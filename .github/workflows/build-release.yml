name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank for an automatic build tag)"
        required: false
        type: string
      release_name:
        description: "Release name (leave blank for an automatic name)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download compile-time mod dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs/mods

          curl --fail --location --retry 3 \
            "https://cdn.modrinth.com/data/Ce6I4WUE/versions/5KzzycBT/Mekanism-1.21.1-10.7.19.85.jar" \
            --output "libs/mods/Mekanism-1.21.1-10.7.19.85.jar"

          curl --fail --location --retry 3 \
            "https://cdn.modrinth.com/data/OFVYKsAk/versions/a6gl7srE/MekanismGenerators-1.21.1-10.7.19.85.jar" \
            --output "libs/mods/MekanismGenerators-1.21.1-10.7.19.85.jar"

          curl --fail --location --retry 3 \
            "https://cdn.modrinth.com/data/T9PomCSv/versions/U678xqle/sable-neoforge-1.21.1-2.0.5.jar" \
            --output "libs/mods/sable-neoforge-1.21.1-2.0.5.jar"

          ls -lh libs/mods

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          MOD_ID="$(sed -n 's/^mod_id=//p' gradle.properties | head -n1)"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n1)"
          JAR="build/libs/${MOD_ID}-${MOD_VERSION}.jar"

          if [[ ! -f "$JAR" ]]; then
            echo "Expected build output not found: $JAR" >&2
            echo "Contents of build/libs:" >&2
            ls -lah build/libs >&2 || true
            exit 1
          fi

          TAG="$INPUT_TAG"
          if [[ -z "$TAG" ]]; then
            TAG="v${MOD_VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi

          TITLE="$INPUT_RELEASE_NAME"
          if [[ -z "$TITLE" ]]; then
            TITLE="Create Aeronautics: Mekanism Compatibility ${TAG}"
          fi

          CHECKSUM="${JAR}.sha256"
          sha256sum "$JAR" > "$CHECKSUM"

          {
            echo "mod_id=$MOD_ID"
            echo "version=$MOD_VERSION"
            echo "jar=$JAR"
            echo "checksum=$CHECKSUM"
            echo "tag=$TAG"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.mod_id }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.jar }}
            ${{ steps.meta.outputs.checksum }}
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          JAR: ${{ steps.meta.outputs.jar }}
          CHECKSUM: ${{ steps.meta.outputs.checksum }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          args=(
            release create "$TAG"
            "$JAR"
            "$CHECKSUM"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh "${args[@]}"
